name: cla

# Asks every outside pull request author to agree to CLA.md, and records who
# has. Signatures live in signatures/cla.json on the cla-signatures branch,
# which is unprotected so the workflow token can write to it; main stays
# protected and is never written to from here.
#
# pull_request_target runs with a write token against the base repository.
# That is safe only because this job never checks out or runs the pull
# request's code. Keep it that way.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # Pinned by commit: this action runs with a write token. v2.6.1.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/openswitchboard-ai/schema/blob/main/CLA.md
          branch: cla-signatures
          # The owner wrote the code and has nothing to sign; bots cannot sign.
          allowlist: lockyt,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged, it needs a
            signed CLA.
            Please read [CLA.md](https://github.com/openswitchboard-ai/schema/blob/main/CLA.md)
            and, if you agree, reply with the line below.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: Everyone on this pull request has signed the CLA.
          lock-pullrequest-aftermerge: false
